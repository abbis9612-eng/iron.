name: Simulation tests (dotnet)

# Runs the engine-independent kernel and its EditMode tests on every push.
# The official gate is still `unity test` on the dev machine (GDD section 0, rule 12).
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test Tests.DotNet --logger "console;verbosity=normal"
